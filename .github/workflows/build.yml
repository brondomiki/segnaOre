name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "supabase/**", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Test e build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Mostra errori
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|AssertionError|expected|What went wrong" -A2 build.log | head -80 > errors.txt || true
          [ -s errors.txt ] || tail -60 build.log > errors.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build fallita::$msg"
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SegnaOre.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SegnaOre-apk
          path: SegnaOre.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SegnaOre build ${{ github.run_number }}
          files: SegnaOre.apk
          make_latest: true
